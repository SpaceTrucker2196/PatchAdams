# xcodegen spec for the Patch Adam macOS app. Run `xcodegen generate`
# (or `make generate`) to produce PatchAdam.xcodeproj. The .xcodeproj
# is gitignored — this YAML is the authoritative project definition.

name: PatchAdam

options:
  bundleIdPrefix: io.river.patchadam
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # Notarization requires the hardened runtime (D2, M5).
    ENABLE_HARDENED_RUNTIME: YES

packages:
  PatchAdam:
    path: .

targets:
  PatchAdam:
    type: application
    platform: macOS
    sources:
      - path: App
    # Not sandboxed: the app shells out to the user's `git` for
    # `show`, `ls-tree`, `cat-file` (docs/spec.md, Stack). App-sandbox
    # would block subprocess spawning and arbitrary repository reads.
    # This forecloses App Store distribution; the spec proposes direct,
    # notarized distribution (open question, DECISIONS.md D2).
    entitlements:
      path: App/PatchAdam.entitlements
      properties:
        com.apple.security.app-sandbox: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Patch Adam
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: "14.0"
        # The .patchadam session package (spec "Persistence").
        CFBundleDocumentTypes:
          - CFBundleTypeName: Patch Adam Session
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [io.river.patchadam.session]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.river.patchadam.session
            UTTypeDescription: Patch Adam Session
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [patchadam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.river.patchadam.mac
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: PatchAdam
        product: PatchModel
      - package: PatchAdam
        product: BaseLoader
      - package: PatchAdam
        product: ApplyEngine
      - package: PatchAdam
        product: DiffEngine
      - package: PatchAdam
        product: AlignmentEngine
      - package: PatchAdam
        product: SessionModel

schemes:
  PatchAdam:
    build:
      targets:
        PatchAdam: all
    run:
      config: Debug
    test:
      config: Debug
